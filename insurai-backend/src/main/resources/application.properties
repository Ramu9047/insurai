
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/insurai_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:InsurAI_Super_Secret_Jwt_Key_2026_Must_Be_At_Least_32_Bytes_Long_Default!}
jwt.expiration=86400000

# Groq API
groq.api.key=${GROQ_API_KEY}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Upload Storage Base URL
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080/uploads/}