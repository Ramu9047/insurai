name: CI Pipeline

on:
  push:
    branches: [ main, "remediation/*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Unit Tests (mvn test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        working-directory: ./insurai-backend
        run: mvn test -B

  frontend-build:
    name: Frontend Build (npm run build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './insurai-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./insurai-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./insurai-frontend
        run: npm run build
